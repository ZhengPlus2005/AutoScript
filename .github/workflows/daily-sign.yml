name: Daily sign-in

on:
  schedule:
    # 00:00 in Asia/Taipei (UTC+8) is 16:00 UTC on the previous day.
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  daily-sign:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: python -m pip install requests

      - name: Run test.py
        env:
          SHIYUYOU_COOKIE: ${{ secrets.SHIYUYOU_COOKIE }}
          PYTHONIOENCODING: utf-8
        shell: bash
        run: |
          set -o pipefail
          if [[ -z "$SHIYUYOU_COOKIE" ]]; then
            echo "::error::Repository secret SHIYUYOU_COOKIE is not configured." | tee "$RUNNER_TEMP/sign-in.log"
            exit 1
          fi
          # Determine success from the response text, not Python's exit code.
          python -u test.py 2>&1 | tee "$RUNNER_TEMP/sign-in.log" || true
          if grep -Fq -e '签到成功' -e '您今天已经签到了' "$RUNNER_TEMP/sign-in.log"; then
            echo '::notice::Sign-in status: success'
            exit 0
          else
            echo '::error::Sign-in status: failure. No expected success message was found in test.py output.'
            exit 1
          fi

      - name: Publish sign-in summary
        if: always()
        shell: bash
        run: |
          {
            echo '## 签到运行输出'
            echo
            echo "运行时间：$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M:%S') (UTC+8)"
            echo
            if [[ -f "$RUNNER_TEMP/sign-in.log" ]]; then
              echo '```text'
              cat "$RUNNER_TEMP/sign-in.log"
              echo
              echo '```'
            else
              echo '未产生签到输出，请检查前面的步骤日志。'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
