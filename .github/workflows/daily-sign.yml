name: Daily sign-in

on:
  schedule:
    # 00:00 in Asia/Taipei is 16:00 UTC on the previous day.
    - cron: "0 16 23-31 8 *"
    - cron: "0 16 1-4 9 *"

permissions:
  contents: read

jobs:
  daily-sign:
    runs-on: ubuntu-latest

    steps:
      - name: Check execution date
        id: date_guard
        shell: bash
        run: |
          local_date="$(TZ=Asia/Taipei date +%F)"
          if [[ "$local_date" < "2026-08-24" || "$local_date" > "2026-09-05" ]]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping outside the configured date range: $local_date"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Running for Asia/Taipei date: $local_date"
          fi

      - name: Check out repository
        if: steps.date_guard.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.date_guard.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        if: steps.date_guard.outputs.should_run == 'true'
        run: python -m pip install requests

      - name: Run test.py
        if: steps.date_guard.outputs.should_run == 'true'
        env:
          SHIYUYOU_COOKIE: ${{ secrets.SHIYUYOU_COOKIE }}
        shell: bash
        run: |
          if [[ -z "$SHIYUYOU_COOKIE" ]]; then
            echo "::error::Repository secret SHIYUYOU_COOKIE is not configured."
            exit 1
          fi
          python test.py
